# hakpak: DHCP server for the WSL network (replaces isc-dhcp-server).
# port=0 turns off dnsmasq's DNS server, so it doesn't fight
# systemd-resolved for port 53. Clients get 172.21.48.1 as their DNS.
port=0

domain=nitro.local
dhcp-range=172.21.48.10,172.21.48.20,255.255.240.0,10m
dhcp-option=option:router,172.21.48.1
dhcp-option=option:dns-server,172.21.48.1
