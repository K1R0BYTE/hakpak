# hakpak sample access point for hostapd.
# setup-router --ap starts it with: hostapd -B -i <in interface> <this file>
#
# Settings are picked so that almost any Wi-Fi adapter and client works:
# 2.4 GHz 802.11g on channel 6 (allowed in every country), WPA2-PSK with
# AES (CCMP). No WPA3, 5 GHz or 802.11n/ac, which many cheap adapters
# can't do in AP mode.

interface=wlan0
driver=nl80211

ssid=hakpak
hw_mode=g
channel=6
wmm_enabled=1
# Set your regulatory domain if you change the channel, e.g. US, GB, DE
#country_code=US

# Faster 802.11n, if your adapter supports it in AP mode:
#ieee80211n=1

# WPA2-PSK
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=hacktheplanet

# For an open network instead, comment out the four wpa lines above.
