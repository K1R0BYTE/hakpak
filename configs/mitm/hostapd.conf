# hakpak sample access point for hostapd.
# setup-router --ap starts it with: hostapd -B -i <in interface> <this file>
#
# Settings are picked so that almost any Wi-Fi adapter and client works:
# 2.4 GHz 802.11n on channel 6 (allowed in every country) at 20 MHz width
# (no ht_capab, so no 40 MHz), WPA2-PSK with AES (CCMP). No WPA3 or 5 GHz,
# which many cheap adapters can't do in AP mode.

interface=wlan0
driver=nl80211

ssid=hakpak
hw_mode=g
channel=6
# 802.11n (needs WMM). Older 802.11g clients can still join.
ieee80211n=1
wmm_enabled=1
# Set your regulatory domain if you change the channel, e.g. US, GB, DE
#country_code=US

# WPA2-PSK
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=hacktheplanet

# For an open network instead, comment out the four wpa lines above.
