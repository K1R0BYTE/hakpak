# hakpak sample access point for hostapd.
# setup-router --ap starts it with: hostapd -B -i <in interface> <this file>
# Check your card supports AP mode first: iw list | grep -A10 "Supported interface modes"

interface=wlan0
driver=nl80211

ssid=hakpak
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
# Set your regulatory domain, e.g. US, GB, DE
#country_code=US

# Open network (no password). For WPA2 instead, comment out auth_algs
# and uncomment the block below.
auth_algs=1

#wpa=2
#wpa_key_mgmt=WPA-PSK
#rsn_pairwise=CCMP
#wpa_passphrase=change-me-please
