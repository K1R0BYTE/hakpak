# hakpak sample DHCP + DNS for clients of the access point.
# setup-router --ap starts it with: dnsmasq -C <this file> --interface=<in interface>
# The interface comes from the command line, so it isn't set here.
# Addresses match setup-router's default --address 10.0.0.1/24.

# Only listen on the AP interface, so it doesn't clash with
# systemd-resolved on 127.0.0.53.
bind-interfaces
except-interface=lo

dhcp-range=10.0.0.10,10.0.0.100,255.255.255.0,12h
dhcp-option=option:router,10.0.0.1
dhcp-option=option:dns-server,10.0.0.1

# Upstream DNS for clients
no-resolv
server=1.1.1.1
server=8.8.8.8

# See every client and DNS query
log-dhcp
log-queries
