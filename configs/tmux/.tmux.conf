## General

# Remap prefix to screens
set -g prefix C-b
bind C-b send-prefix

# Vi mode
#setw -g mode-keys vi
#set-window-option -g mode-keys vi

# Terminal & Shell
set -g default-terminal "xterm-256color"
set -g default-shell /bin/zsh

# Plugins
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Scroll history
set -g history-limit 50000

# don't rename windows automatically
set -g allow-rename off

# Show messages for 4 seconds
set -g display-time 4000

# Set first window to index 1 (not 0) to map more to the keyboard layout
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

#bind-key j command-prompt -p "join pane from:" "join-pane -s '%%'"
#bind-key s command-prompt -p "send pane to:"   "join-pane -t '%%'"

# Make mouse useful, tmux > 2.1
set-option -g mouse on

# Lower escape timing for quicker response to scroll-buffer access
set -s escape-time 50

# Disable command repeat
set-option -g repeat-time 0

## Status bar

# Pass 24-bit color through, so the prompt themes keep their exact colors
set -ga terminal-overrides ",*256col*:Tc"

# Colours and the left and right text come from the hakpak theme in use:
# one of themes/*.conf next to this file, picked with `hakpak-theme <name>`
# (neon unless you chose another). ~/.tmux.conf links into the repo, which
# is how the theme files are found.
set -g status-interval 2
set -g status-left-length 32
set -g status-right-length 100
run-shell 'tmux source-file "$("$(dirname "$(readlink -f ~/.tmux.conf)")/../../tools/hakpak-theme" --path tmux)"'

# Drag to re-order windows
bind -n MouseDrag1Status swap-window -t=

# Double click on the window list to open a new window
bind -n DoubleClick1Status new-window


# make scrolling with wheels work
#bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
#bind -n WheelDownPane select-pane -t= \; send-keys

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)

run '~/.tmux/plugins/tpm/tpm'
