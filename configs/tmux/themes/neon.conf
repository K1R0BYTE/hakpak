# hakpak tmux theme: neon. Goes with configs/starship/neon.toml.
# Loaded by .tmux.conf and by `hakpak-theme neon`.
set -g status-style "fg=#e0aaff,bg=#3c096c"
set -g pane-border-style "fg=#3c096c"
set -g pane-active-border-style "fg=#c77dff"
set -g message-style "fg=#14071f,bg=#ff2a9d"
set -g mode-style "fg=#14071f,bg=#c77dff"
set -g status-left "#[fg=#14071f,bg=#ff2a9d,bold] #S #[default] "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#ffffff,bg=#7b2cbf,bold] #I:#W "
# Right: the eth0 address, and the tun0 (VPN) address when there is one.
set -g status-right '#(ip -4 addr show eth0 2>/dev/null | grep -o "inet [0-9.]*" | head -n1 | cut -d" " -f2 | sed "s/^/ eth0 /") #[fg=#14071f,bg=#ff2a9d,bold]#(ip -4 addr show tun0 2>/dev/null | grep -o "inet [0-9.]*" | head -n1 | cut -d" " -f2 | sed "s/^/ tun0 /; s/$/ /")'
