# hakpak tmux theme: wireframe. Goes with configs/starship/wireframe.toml.
# Loaded by .tmux.conf and by `hakpak-theme wireframe`.
set -g status-style "fg=#8b7aa8,bg=default"
set -g pane-border-style "fg=#3c096c"
set -g pane-active-border-style "fg=#7b2cbf"
set -g message-style "fg=#ff2a9d,bg=default"
set -g mode-style "fg=#14071f,bg=#2de2e6"
set -g status-left "#[fg=#ff2a9d,bold][#S]#[default] "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#2de2e6,bold] #I:#W "
# Right: the eth0 address, and the tun0 (VPN) address when there is one.
set -g status-right '#[fg=#c77dff]#(ip -4 addr show eth0 2>/dev/null | grep -o "inet [0-9.]*" | head -n1 | cut -d" " -f2 | sed "s/^/eth0 /") #[fg=#ff2a9d,bold]#(ip -4 addr show tun0 2>/dev/null | grep -o "inet [0-9.]*" | head -n1 | cut -d" " -f2 | sed "s/^/tun0 /; s/$/ /")'
