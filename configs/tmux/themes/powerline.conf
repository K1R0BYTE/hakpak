# hakpak tmux theme: powerline. Goes with configs/starship/powerline.toml.
# Needs a Nerd Font, like the prompt: \uE0B0 is the powerline arrow.
# Loaded by .tmux.conf and by `hakpak-theme powerline`.
set -g status-style "fg=#e0aaff,bg=#170d26"
set -g pane-border-style "fg=#3c096c"
set -g pane-active-border-style "fg=#2de2e6"
set -g message-style "fg=#14071f,bg=#f9f002"
set -g mode-style "fg=#14071f,bg=#2de2e6"
set -g status-left "#[fg=#14071f,bg=#2de2e6,bold] #S #[fg=#2de2e6,bg=#170d26,nobold]\uE0B0#[default] "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#170d26,bg=#7b2cbf]\uE0B0#[fg=#ffffff,bold] #I:#W #[fg=#7b2cbf,bg=#170d26,nobold]\uE0B0"
# Right: the eth0 address, and the tun0 (VPN) address when there is one.
set -g status-right '#(ip -4 addr show eth0 2>/dev/null | grep -o "inet [0-9.]*" | head -n1 | cut -d" " -f2 | sed "s/^/ eth0 /") #[fg=#14071f,bg=#f9f002,bold]#(ip -4 addr show tun0 2>/dev/null | grep -o "inet [0-9.]*" | head -n1 | cut -d" " -f2 | sed "s/^/ tun0 /; s/$/ /")'
