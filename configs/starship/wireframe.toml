# hakpak prompt theme: wireframe. Thin neon lines and colored text, no
# filled blocks. Uses only characters every terminal font has. Switch themes
# with `hakpak-theme <name>`.
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'hakpak'
add_newline = true

# Only the modules named here are shown.
format = '''
[╭─\[](fg:violet)$username[@](fg:dim)$hostname[\]─\[](fg:violet)$directory[\]](fg:violet)([─\[](fg:violet)$git_branch$git_status[\]](fg:violet))([─\[](fg:violet)$python[\]](fg:violet))([─\[](fg:violet)$status[\]](fg:violet))$cmd_duration
[╰─](fg:violet)$character'''

[palettes.hakpak]
ink = '#14071f'
deep = '#3c096c'
violet = '#7b2cbf'
neon = '#c77dff'
lilac = '#e0aaff'
pink = '#ff2a9d'
cyan = '#2de2e6'
yellow = '#f9f002'
red = '#ff3864'
dim = '#8b7aa8'

[username]
show_always = true
format = '[$user]($style)'
style_user = 'bold fg:neon'
style_root = 'bold fg:red'

[hostname]
ssh_only = false
format = '[$hostname]($style)'
style = 'bold fg:neon'

[directory]
format = '[$path$read_only]($style)'
style = 'fg:cyan'
read_only = ' ro'
truncation_symbol = '…/'
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = '[$branch](fg:pink)'

[git_status]
format = '([$all_status$ahead_behind](fg:yellow))'
conflicted = ' =${count}'
ahead = ' ⇡${count}'
behind = ' ⇣${count}'
diverged = ' ⇡${ahead_count}⇣${behind_count}'
untracked = ' ?${count}'
stashed = ''
modified = ' !${count}'
staged = ' +${count}'
renamed = ' »${count}'
deleted = ' ✘${count}'

[python]
format = '([venv $virtualenv](fg:lilac))'

[status]
disabled = false
format = '[exit $status](bold fg:red)'

[cmd_duration]
min_time = 2000
format = '[  $duration](fg:dim)'

[character]
success_symbol = '[❯](bold fg:pink)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:cyan)'
