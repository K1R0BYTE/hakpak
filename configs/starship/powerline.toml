# hakpak prompt theme: powerline. Arrow segments with icons.
# Needs a Nerd Font set in your terminal (https://www.nerdfonts.com); without
# one the arrows and icons show as empty boxes. The glyphs are written as
# \uXXXX escapes. Switch themes with `hakpak-theme <name>`.
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'hakpak'
add_newline = true

# Only the modules named here are shown.  is the powerline arrow; an
# "inverted" arrow cuts a notch into the start of a segment.
format = """
$username$hostname[](fg:cyan bg:deep)$directory[](fg:deep)\
([](fg:violet inverted)$git_branch$git_status[](fg:violet))\
([](fg:red inverted)$status[](fg:red))\
$python$cmd_duration
$character"""

[palettes.hakpak]
ink = '#14071f'
deep = '#3c096c'
violet = '#7b2cbf'
neon = '#c77dff'
lilac = '#e0aaff'
pink = '#ff2a9d'
cyan = '#2de2e6'
yellow = '#f9f002'
red = '#ff3864'
dim = '#8b7aa8'

[username]
show_always = true
format = "[  $user]($style)"
style_user = 'bold fg:ink bg:cyan'
style_root = 'bold fg:red bg:cyan'

[hostname]
ssh_only = false
format = '[@$hostname ]($style)'
style = 'bold fg:ink bg:cyan'

[directory]
format = "[  $path$read_only ]($style)"
style = 'fg:lilac bg:deep'
read_only = " "
truncation_symbol = '…/'
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = "[  $branch](bold fg:#ffffff bg:violet)"

[git_status]
format = '([$all_status$ahead_behind](bold fg:yellow bg:violet))'
conflicted = ' =${count}'
ahead = ' ⇡${count}'
behind = ' ⇣${count}'
diverged = ' ⇡${ahead_count}⇣${behind_count}'
untracked = ' ?${count}'
stashed = ''
modified = ' !${count}'
staged = ' +${count}'
renamed = ' »${count}'
deleted = ' ✘${count}'

[python]
format = "([  $virtualenv](fg:yellow))"

[status]
disabled = false
format = '[ ✘ $status ](bold fg:#ffffff bg:red)'

[cmd_duration]
min_time = 2000
format = '[  $duration](fg:dim)'

[character]
success_symbol = '[❯](bold fg:cyan)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:yellow)'
